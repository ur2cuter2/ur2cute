<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-title" content="語句WS">
  <title>語句ワークシート 学習記録</title>
  <style>
    :root {
      --bg: #f7f5ef;
      --panel: #fffdf8;
      --ink: #1f2933;
      --muted: #5b6470;
      --line: #d9d3c7;
      --accent: #2f6f73;
      --accent-soft: #e3f0ef;
      --review: #a4550b;
      --review-soft: #fff1cf;
      --done: #2f6f4e;
      --done-soft: #e2f3e9;
      --none: #626b76;
      --none-soft: #eef0f2;
      --danger: #9f2f2f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      font-size: 18px;
      line-height: 1.6;
    }

    button, input, select, textarea { font: inherit; }
    button:disabled, input:disabled { cursor: default; opacity: .55; }
    [hidden] { display: none !important; }
    #answerReview { margin: 16px 0; }
    #reviewError:empty { display: none; }
    #answerReview input, #answerReview select, #answerReview button, #openAnswerReview { min-height: 44px; }
    .review-controls { display: flex; flex-wrap: wrap; gap: 12px; margin: 16px 0; }
    .review-controls label { display: grid; gap: 6px; }
    .review-entry { border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin: 12px 0; }
    .review-entry summary { cursor: pointer; min-height: 44px; overflow-wrap: anywhere; }
    .review-entry p { white-space: pre-wrap; overflow-wrap: anywhere; }
    .meaning-panel { display: grid; gap: 8px; min-width: 0; }
    .meaning-panel:empty { display: none; }
    .meaning-panel textarea { width: 100%; min-height: 110px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; }
    .meaning-panel p { margin: 0; }
    .meaning-error, .storage-notice { color: var(--danger); font-weight: 700; }
    .meaning-history { white-space: pre-wrap; overflow-wrap: anywhere; }
    .storage-notice { padding: 12px; border: 2px solid var(--danger); background: #fff8f8; }


    .app {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 20px 16px 40px;
    }

    header {
      display: grid;
      gap: 14px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.2;
      letter-spacing: 0;
    }

    .top-bar, .toolbar, .summary {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(31, 41, 51, 0.06);
    }

    .top-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: end;
      padding: 14px;
    }

    .field {
      display: grid;
      gap: 6px;
      min-width: min(100%, 210px);
    }

    label { font-weight: 700; }

    input[type="date"], input[type="search"], select {
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 8px 12px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .summary-item {
      display: grid;
      gap: 2px;
      background: #fff;
      padding: 13px;
      text-align: center;
      font-weight: 700;
    }

    .summary-item span {
      color: var(--muted);
      font-size: 15px;
    }

    .summary-item strong {
      font-size: 30px;
      line-height: 1.2;
    }

    .toolbar {
      display: grid;
      gap: 14px;
      padding: 14px;
      margin-bottom: 16px;
    }

    .filter-row, .download-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .filter-button, .download-button, .reset-button {
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 9px 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .filter-button[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .download-button {
      background: var(--accent-soft);
      border-color: #b7d8d5;
    }

    .import-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .import-button input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .reset-button {
      margin-left: auto;
      color: var(--danger);
      border-color: #e2b8b8;
      background: #fff8f8;
    }

    .result-line {
      margin: 0 0 12px;
      color: var(--muted);
      font-weight: 700;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 14px;
      align-items: start;
    }

    .word-card {
      display: grid;
      gap: 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(31, 41, 51, 0.06);
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: start;
    }

    .card-main {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .card-text {
      flex: 1 1 auto;
      min-width: 0;
    }

    .word-card-thumbnail {
      width: 72px;
      height: 72px;
      object-fit: contain;
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .word-title {
      margin: 0;
      font-size: 26px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .word-title small {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 16px;
      font-weight: 700;
    }

    .meta {
      display: grid;
      gap: 3px;
      margin: 0;
      color: var(--muted);
      font-weight: 700;
    }

    .meta div {
      display: flex;
      gap: 8px;
    }

    .status-label {
      flex: 0 0 auto;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 15px;
      font-weight: 800;
      white-space: nowrap;
    }

    .status-not_started { color: var(--none); background: var(--none-soft); }
    .status-review { color: var(--review); background: var(--review-soft); }
    .status-completed { color: var(--done); background: var(--done-soft); }

    .checks {
      display: grid;
      gap: 10px;
    }

    .check-option {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 50px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
    }

    .check-option input {
      width: 28px;
      height: 28px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .check-option:has(input:checked) {
      background: var(--accent-soft);
      border-color: var(--accent);
    }

    .answer-toggle {
      justify-self: start;
      min-height: 46px;
      border: 1px solid #b7d8d5;
      border-radius: 8px;
      background: var(--accent-soft);
      color: var(--ink);
      padding: 8px 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .answer-box {
      display: grid;
      gap: 6px;
      border: 1px solid #ead9a7;
      border-radius: 8px;
      background: #fff9e8;
      padding: 12px;
      font-size: 19px;
      font-weight: 700;
    }

    .answer-box h3, .answer-box p { margin: 0; }
    .answer-box h3 { font-size: 20px; line-height: 1.3; }
    .answer-note { white-space: pre-line; }
    .answer-help { color: var(--muted); font-size: 16px; font-weight: 700; }

    .empty {
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 24px;
      background: #fff;
      color: var(--muted);
      text-align: center;
      font-weight: 700;
    }

    .celebration-overlay[hidden] { display: none; }
    .celebration-overlay {
      position: fixed; inset: 0; z-index: 1000; display: flex;
      align-items: center; justify-content: center; padding: 20px;
      background: rgba(20, 36, 49, .65); overscroll-behavior: contain;
    }
    .celebration-dialog {
      position: relative; width: min(540px, 100%); max-height: 90vh;
      overflow: auto; padding: 48px 24px 28px; border-radius: 24px;
      background: #fffdf8; text-align: center; border: 3px solid #efc35c;
      box-shadow: 0 20px 70px rgba(0, 0, 0, .25);
    }
    .celebration-icon { font-size: 80px; line-height: 1.3; }
    .celebration-dialog h2 { font-size: clamp(26px, 5vw, 34px); line-height: 1.4; }
    .celebration-close { position: absolute; top: 8px; right: 8px; }
    .celebration-dialog button {
      min-width: 48px; min-height: 48px; border-radius: 12px; border: 1px solid #b7d8d5;
      padding: 10px 20px; background: var(--accent); color: white; font-weight: 700;
      cursor: pointer;
    }
    /* NOTIFICATION START */
    #celebrationReport { display: block; margin: 20px auto 8px; max-width: 100%; white-space: normal; overflow-wrap: anywhere; }
    #celebrationReport:disabled { cursor: default; opacity: .75; }
    #celebrationReportStatus { font-size: 14px; overflow-wrap: anywhere; }
    /* NOTIFICATION END */
    .celebration-confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .celebration-confetti i {
      position: absolute; top: -20px; left: var(--x); width: 9px; height: 16px;
      background: var(--color); animation: celebration-fall 2.4s var(--delay) both;
    }
    @keyframes celebration-fall {
      from { transform: translateY(0) rotate(0); opacity: 1; }
      to { transform: translateY(520px) rotate(280deg); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .celebration-confetti { display: none; }
    }

    @media (max-width: 640px) {
      body { font-size: 17px; }
      .app { padding: 14px 10px 32px; }
      .summary { grid-template-columns: 1fr; }
      .cards { grid-template-columns: 1fr; }
      .reset-button { margin-left: 0; }
      .field { width: 100%; }
      .filter-button, .download-button, .reset-button { flex: 1 1 150px; }
    }

    @media (max-width: 520px) {
      .word-card-thumbnail {
        width: 56px;
        height: 56px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>語句ワークシート 学習記録</h1>
      <section class="top-bar" aria-label="学習日と検索">
        <div class="field">
          <label for="studyDate">日付</label>
          <input id="studyDate" type="date">
        </div>
        <div class="field">
          <label for="searchText">検索</label>
          <input id="searchText" type="search" placeholder="語句・読み・カテゴリ">
        </div>
        <div class="field">
          <label for="categoryFilter">カテゴリ</label>
          <select id="categoryFilter"></select>
        </div>
      </section>
    </header>

    <button class="download-button" type="button" id="openAnswerReview" aria-controls="answerReview" aria-expanded="false">回答確認（保護者用）</button>
    <section id="answerReview" aria-labelledby="answerReviewTitle" hidden>
      <h2 id="answerReviewTitle" tabindex="-1">回答確認（保護者用・読み取り専用）</h2>
      <p>この端末・ブラウザに保存した確定回答を確認できます。正誤判定や保護者の承認は不要です。</p>
      <p id="reviewCounts" role="status"></p>
      <div class="review-controls">
        <label>検索（ID・語句）<input id="reviewSearch" type="search"></label>
        <label>並び替え<select id="reviewSort"><option value="newest">初回確定日時の新しい順</option><option value="oldest">初回確定日時の古い順</option><option value="idAsc">語句IDの昇順</option><option value="idDesc">語句IDの降順</option></select></label>
        <label>絞り込み<select id="reviewFilter"><option value="all">全回答</option><option value="changed">修正あり</option></select></label>
      </div>
      <p id="reviewError" role="alert" class="storage-notice"></p>
      <div id="reviewEntries"></div>
      <div class="review-controls"><button id="reviewPrevious" type="button">前の50件</button><span id="reviewPage" role="status"></span><button id="reviewNext" type="button">次の50件</button></div>
      <button id="closeAnswerReview" type="button" class="download-button">通常画面へ戻る</button>
    </section>
    <div id="learningView">
    <section class="summary" aria-label="集計">
      <div class="summary-item"><span>未着手</span><strong id="notStartedCount">0語</strong></div>
      <div class="summary-item"><span>復習対象</span><strong id="reviewCount">0語</strong></div>
      <div class="summary-item"><span>完了</span><strong id="completedCount">0語</strong></div>
    </section>

    <section class="toolbar" aria-label="表示切替とCSV">
      <div class="filter-row" id="statusFilters"></div>
      <div class="download-row">
        <button class="download-button" type="button" id="downloadAll">全ログCSVダウンロード</button>
        <button class="download-button" type="button" id="downloadReview">復習対象CSVダウンロード</button>
        <button class="download-button" type="button" id="downloadVisible">表示中CSVダウンロード</button>
        <label class="download-button import-button">
          CSVから記録を復元
          <input id="importCsv" type="file" accept=".csv,text/csv">
        </label>
        <button class="reset-button" type="button" id="clearAll">全チェックをクリア</button>
      </div>
    </section>

    <p class="result-line" id="resultLine">読み込み中...</p>
    <section class="cards" id="wordCards" aria-live="polite"></section>
    </div>
  </main>

  <div class="celebration-overlay" id="celebrationOverlay" hidden>
    <section class="celebration-dialog" role="dialog" aria-modal="true"
      aria-labelledby="celebrationTitle" aria-describedby="celebrationPraise">
      <div class="celebration-confetti" id="celebrationConfetti" aria-hidden="true"></div>
      <button class="celebration-close" id="celebrationClose" type="button" aria-label="お祝いを閉じる">×</button>
      <div class="celebration-icon" id="celebrationIcon" aria-hidden="true"></div>
      <h2 id="celebrationTitle"></h2>
      <p id="celebrationPraise">今日までの分を最後までやりきったね。その努力に拍手！</p>
      <!-- NOTIFICATION START -->
      <button id="celebrationReport" type="button" aria-describedby="celebrationReportStatus">📨 修了を報告する</button>
      <p id="celebrationReportStatus" role="status" aria-live="polite"></p>
      <!-- NOTIFICATION END -->
      <button id="celebrationDone" type="button">やったー！</button>
    </section>
  </div>

  <script>
    const STORAGE_KEY = "knowledge-drill-learning-log-v1";
    /* NOTIFICATION START */
    const NOTIFICATION_KEY = "knowledge-drill-notification-v1";
    const NOTIFICATION_URL = "https://ntfy.sh/study-y9n53rqohrg2w2jytdw2aiw47khrbwkf";
    const reportedDates = new Set();
    let reportPending = false;
    let reportViewDate = "";

    function hasReported(date) {
      if (reportedDates.has(date)) return true;
      try {
        return JSON.parse(localStorage.getItem(NOTIFICATION_KEY) || "null")?.lastReportedDate === date;
      } catch { return false; }
    }

    // Transport only: no learning state or UI access. A rejected fetch may have reached the server.
    async function sendCompletionNotification() {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 15000);
      try {
        const response = await fetch(NOTIFICATION_URL, {
          method: "POST", mode: "cors", credentials: "omit",
          headers: { "Content-Type": "text/plain;charset=UTF-8" },
          body: "語句ワークシート完了！", signal: controller.signal
        });
        if (response.type === "opaque" || response.status === 0) return "unknown";
        if (!response.ok) return response.status >= 500 ? "unknown" : "failed";
        return "success";
      } catch { return "unknown"; }
      finally { clearTimeout(timer); }
    }

    function refreshReportButton() {
      const button = document.getElementById("celebrationReport");
      const reported = hasReported(reportViewDate);
      button.disabled = reportPending || reported;
      button.textContent = reportPending ? "報告中…" : reported ? "✅ 報告済み" : "📨 修了を報告する";
      document.getElementById("celebrationReportStatus").textContent = "";
    }

    async function reportCompletion() {
      if (document.getElementById("celebrationOverlay").hidden || reportPending || hasReported(reportViewDate)) return;
      const date = reportViewDate;
      reportPending = true;
      refreshReportButton();
      const result = await sendCompletionNotification();
      reportPending = false;
      if (result === "success") {
        reportedDates.add(date);
        try { localStorage.setItem(NOTIFICATION_KEY, JSON.stringify({ lastReportedDate: date })); } catch { /* Keep this session's receipt. */ }
      }
      refreshReportButton();
      if (date !== reportViewDate) return;
      const button = document.getElementById("celebrationReport");
      const status = document.getElementById("celebrationReportStatus");
      if (result === "success") {
        button.textContent = "✅ 修了を報告しました！";
      } else {
        status.textContent = result === "unknown"
          ? "送信結果を確認できませんでした。再送信すると通知が重複する場合があります"
          : "送信できませんでした。もう一度ためしてね";
      }
    }

    /* NOTIFICATION END */

    function downloadCsv(words, filename) {
      if (!storageBoundary.ready || storageBoundary.blocked || activeWrites) {
        alert("記録の保存状態を確認できないためCSVを出力できません。保存停止中は元データを保護しています。"); return;
      }
      try { assertSnapshot(); } catch (error) { stopStorage(error); return; }
      if (volatileDrafts.size && Array.from(volatileDrafts).some(([id, draft]) => responseFor(id).draft !== draft)) {
        alert("未保存の下書きがあります。文を控えてから確認してください。"); return;
      }
      const csv = buildCsv(words);
      const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob), anchor = document.createElement("a");
      anchor.href = url; anchor.download = filename; document.body.appendChild(anchor); anchor.click(); anchor.remove(); URL.revokeObjectURL(url);
    }
    function buildCsv(words) {
      const rows = [["date", "id", "word", "reading", "category", "planned_date", "lesson_group", "attempted", "understood", "status", "lastUpdated", ...CSV_EXTRA]];
      const date = elements.studyDate.value || getTodayText();
      // All-log exports include orphaned local records/answers, preserving future vocabulary changes.
      const all = words === state.words;
      const byId = new Map(words.map(word => [word.id, word]));
      if (all) for (const id of new Set([...Object.keys(state.records), ...Object.keys(meaningData?.responses || {}), ...(meaningData?.legacyExemptIds || [])])) {
        if (!byId.has(id)) byId.set(id, { id });
      }
      for (const word of byId.values()) {
        const record = getRecord(word.id), response = responseFor(word.id);
        rows.push([date, word.id, word.word || "", word.reading || "", word.category || "", word.planned_date || "", word.lesson_group || "",
          String(record.attempted), String(record.understood), getStatus(word.id).key, record.lastUpdated,
          "1", String(isExempt(word.id)), ...CSV_RESPONSE_FIELDS.map(name => csvText(response[name]))]);
      }
      return rows.map(row => row.map(csvEscape).join(",")).join("\r\n");
    }
    function csvEscape(value) {
      let text = String(value ?? "");
      if (/^[\s\u0000-\u001f]*[=+@-]/u.test(text) || /^[\t\r\n]/u.test(text)) text = "'" + text;
      return /[",\r\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
    }


    const state = {
      words: [],
      records: {},
      activeFilter: "today",
      visibleAnswers: new Set(),
      visibleWords: []
    };

    const elements = {
      studyDate: document.getElementById("studyDate"),
      searchText: document.getElementById("searchText"),
      categoryFilter: document.getElementById("categoryFilter"),
      statusFilters: document.getElementById("statusFilters"),
      cards: document.getElementById("wordCards"),
      resultLine: document.getElementById("resultLine"),
      notStartedCount: document.getElementById("notStartedCount"),
      reviewCount: document.getElementById("reviewCount"),
      completedCount: document.getElementById("completedCount"),
      downloadAll: document.getElementById("downloadAll"),
      downloadReview: document.getElementById("downloadReview"),
      downloadVisible: document.getElementById("downloadVisible"),
      importCsv: document.getElementById("importCsv"),
      clearAll: document.getElementById("clearAll")
    };

    init();

    async function init() {
      elements.studyDate.value = getTodayText();
      setupFilters();
      bindEvents();
      await loadWords();
      if (!state.words.length) return;
      await initializeStorage();
      setupCategories();
      render();
    }

    async function loadWords() {
      try {
        const response = await fetch(DATA_URL, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const words = await response.json();
        if (!Array.isArray(words) || !words.length || words.some(word => !word || !safeId(word.id)
          || typeof word.word !== "string" || !word.word.trim()) || new Set(words.map(word => word.id)).size !== words.length) {
          throw new Error("語句データの形式またはIDが不正です。");
        }
        state.words = words;
      } catch (error) {
        console.error("語句データを読み込めませんでした。", error);
        elements.resultLine.textContent = "語句データを読み込めませんでした。";
        elements.cards.innerHTML = '<div class="empty">data/words.json を確認してください。</div>';
      }
    }

    function bindEvents() {
      bindAnswerReview();
    /* NOTIFICATION START */
      document.getElementById("celebrationReport").addEventListener("click", reportCompletion);
      window.addEventListener("storage", (event) => {
        if (event.key === NOTIFICATION_KEY) refreshReportButton();
      });
    /* NOTIFICATION END */
      document.getElementById("celebrationClose").addEventListener("click", closeCelebration);
      document.getElementById("celebrationDone").addEventListener("click", closeCelebration);
      document.getElementById("celebrationOverlay").addEventListener("keydown", (event) => {
        if (event.key === "Escape") { event.preventDefault(); closeCelebration(); }
    /* NOTIFICATION START */
        if (event.key === "Tab") {
          event.preventDefault();
          const buttons = Array.from(document.querySelectorAll("#celebrationOverlay button:not(:disabled)"));
          const index = buttons.indexOf(document.activeElement);
          buttons[(index + (event.shiftKey ? -1 : 1) + buttons.length) % buttons.length].focus();
          return;
        }
    /* NOTIFICATION END */
        if (event.key === "Tab") {
          event.preventDefault();
          const close = document.getElementById("celebrationClose");
          const done = document.getElementById("celebrationDone");
          (document.activeElement === done ? close : done).focus();
        }
      });
      elements.studyDate.addEventListener("change", resetAnswersAndRender);
      elements.searchText.addEventListener("input", resetAnswersAndRender);
      elements.categoryFilter.addEventListener("change", resetAnswersAndRender);
      elements.downloadAll.addEventListener("click", () => downloadCsv(state.words, "learning-log-all.csv"));
      elements.downloadReview.addEventListener("click", () => {
        const reviewWords = state.words.filter((word) => getStatus(word.id).key === "review");
        downloadCsv(reviewWords, "learning-log-review.csv");
      });
      elements.downloadVisible.addEventListener("click", () => downloadCsv(state.visibleWords, "learning-log-visible.csv"));
      elements.importCsv.addEventListener("change", importCsvRecords);
      elements.clearAll.addEventListener("click", clearAllChecks);
    }

    function setupFilters() {
      elements.statusFilters.innerHTML = "";
      for (const filter of FILTERS) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "filter-button";
        button.dataset.filter = filter.key;
        button.textContent = filter.label;
        button.setAttribute("aria-pressed", filter.key === state.activeFilter ? "true" : "false");
        button.addEventListener("click", () => {
          state.activeFilter = filter.key;
          state.visibleAnswers.clear();
          updateFilterButtons();
          render();
        });
        elements.statusFilters.appendChild(button);
      }
    }

    function updateFilterButtons() {
      for (const button of elements.statusFilters.querySelectorAll("button")) {
        button.setAttribute("aria-pressed", button.dataset.filter === state.activeFilter ? "true" : "false");
      }
    }

    function setupCategories() {
      const categories = Array.from(new Set(state.words.map((word) => word.category).filter(Boolean))).sort();
      elements.categoryFilter.innerHTML = "";
      const allOption = document.createElement("option");
      allOption.value = "all";
      allOption.textContent = "すべて";
      elements.categoryFilter.appendChild(allOption);
      for (const category of categories) {
        const option = document.createElement("option");
        option.value = category;
        option.textContent = category;
        elements.categoryFilter.appendChild(option);
      }
    }

    function render() {
      state.visibleWords = getFilteredWords();
      renderSummary();
      renderCards(state.visibleWords);
      elements.resultLine.textContent = `表示中：${state.visibleWords.length}語`;
    }

    function resetAnswersAndRender() {
      state.visibleAnswers.clear();
      render();
    }

    function getFilteredWords() {
      const query = elements.searchText.value.trim().toLowerCase();
      const selectedCategory = elements.categoryFilter.value;
      const selectedDate = elements.studyDate.value;
      const hasPlannedDates = state.words.some((word) => word.planned_date);

      return state.words
        .filter((word) => {
          if (state.activeFilter === "today" && hasPlannedDates) return word.planned_date === selectedDate;
          if (state.activeFilter === "due_today") return isDueToday(word, selectedDate);
          return true;
        })
        .filter((word) => {
          if (["not_started", "review", "completed"].includes(state.activeFilter)) return getStatus(word.id).key === state.activeFilter;
          return true;
        })
        .filter((word) => selectedCategory === "all" || word.category === selectedCategory)
        .filter((word) => {
          if (!query) return true;
          const target = `${word.word} ${word.reading} ${word.category}`.toLowerCase();
          return target.includes(query);
        })
        .sort((a, b) => {
          if (state.activeFilter === "due_today") return compareDueToday(a, b);
          return String(a.planned_date || "").localeCompare(String(b.planned_date || ""))
            || String(a.id || "").localeCompare(String(b.id || ""), "ja", { numeric: true })
            || String(a.lesson_group || "").localeCompare(String(b.lesson_group || ""), "ja", { numeric: true })
            || Number(a.display_order || 0) - Number(b.display_order || 0);
        });
    }

    function isDueToday(word, selectedDate) {
      return Boolean(word.planned_date)
        && word.planned_date <= selectedDate
        && !getRecord(word.id).attempted;
    }

    function compareDueToday(a, b) {
      return String(a.planned_date || "").localeCompare(String(b.planned_date || ""))
        || String(a.id || "").localeCompare(String(b.id || ""), "ja", { numeric: true })
        || String(a.lesson_group || "").localeCompare(String(b.lesson_group || ""), "ja", { numeric: true })
        || Number(a.display_order || 0) - Number(b.display_order || 0);
    }

    function renderSummary() {
      const counts = { not_started: 0, review: 0, completed: 0 };
      for (const word of state.words) counts[getStatus(word.id).key] += 1;
      elements.notStartedCount.textContent = `${counts.not_started}語`;
      elements.reviewCount.textContent = `${counts.review}語`;
      elements.completedCount.textContent = `${counts.completed}語`;
    }

    function renderCards(words) {
      elements.cards.innerHTML = "";
      if (words.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "表示する語句がありません。";
        elements.cards.appendChild(empty);
        return;
      }

      const fragment = document.createDocumentFragment();
      for (const word of words) fragment.appendChild(createWordCard(word));
      elements.cards.appendChild(fragment);
    }

    function createWordCard(word) {
      const record = getRecord(word.id);
      const status = getStatus(word.id);
      const isAnswerVisible = state.visibleAnswers.has(word.id) && canReveal(word.id);
      const imageSrc = getImageSrc(word);
      const answerId = `answer-${word.id}`;
      const article = document.createElement("article");
      article.className = "word-card";
      article.dataset.wordId = word.id;

      article.innerHTML = `
        <div class="card-main">
          <div class="card-text">
            <div class="card-head">
              <h2 class="word-title"><small>No.${escapeHtml(word.id)}</small>${escapeHtml(word.word)}</h2>
              <span class="status-label status-${status.key}">${status.label}</span>
            </div>
            <dl class="meta">
              <div><dt>読み：</dt><dd>${escapeHtml(word.reading)}</dd></div>
              <div><dt>カテゴリ：</dt><dd>${escapeHtml(word.category)}</dd></div>
            </dl>
          </div>
          ${imageSrc ? `<img class="word-card-thumbnail" src="${escapeHtml(imageSrc)}" alt="${escapeHtml(word.word)}のイメージ画像">` : ""}
        </div>
        <button class="answer-toggle" type="button" aria-expanded="${isAnswerVisible ? "true" : "false"}" aria-controls="${answerId}">
          ${isAnswerVisible ? "答えを隠す" : "答えを見る"}
        </button>
        ${isAnswerVisible ? `
          <section class="answer-box" id="${answerId}">
            <h3>答え：</h3>
            <p class="answer-note">${escapeHtml(word.answer_note || "答えデータはまだありません。")}</p>
          </section>
        ` : ""}
        <div class="checks">
          <label class="check-option">
            <input type="checkbox" data-kind="attempted" ${record.attempted ? "checked" : ""} ${isCheckDisabled(word.id, "attempted") ? "disabled" : ""}>
            <span>できた</span>
          </label>
          <label class="check-option">
            <input type="checkbox" data-kind="understood" ${record.understood ? "checked" : ""} ${isCheckDisabled(word.id, "understood") ? "disabled" : ""}>
            <span>わかった</span>
          </label>
        </div>
      `;

      createMeaningPanel(article, word);
      article.querySelectorAll("input[type='checkbox']").forEach((checkbox) => {
        checkbox.addEventListener("change", async (event) => {
          const kind = event.target.dataset.kind;
          if (!await updateCheck(word.id, kind, event.target.checked)) checkbox.checked = getRecord(word.id)[kind];
        });
      });
      article.querySelectorAll(".word-card-thumbnail").forEach((image) => {
        image.addEventListener("error", () => {
          image.style.display = "none";
        });
      });
      article.querySelector(".answer-toggle").addEventListener("click", () => toggleAnswer(word.id));
      return article;
    }

    function toggleAnswer(wordId) {
      if (!canReveal(wordId)) { requestMeaning(wordId); return; }
      if (state.visibleAnswers.has(wordId)) state.visibleAnswers.delete(wordId);
      else state.visibleAnswers.add(wordId);
      render();
      document.getElementById(`meaning-${wordId}`)?.focus();
    }

    function isValidPlannedDate(value) {
      if (typeof value !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
      const date = new Date(value + "T12:00:00Z");
      return !Number.isNaN(date.getTime()) && date.toISOString().slice(0, 10) === value;
    }

    function getAchievementWords(today) {
      return state.words.filter((word) => isValidPlannedDate(word.planned_date) && word.planned_date <= today);
    }

    function isLearningAchieved(today) {
      const dueWords = getAchievementWords(today);
      return dueWords.length > 0 && dueWords.every((word) => state.records[word.id]?.attempted === true);
    }

    function loadCelebrationDate() {
      try {
        const saved = JSON.parse(localStorage.getItem(CELEBRATION_KEY) || "null");
        return isValidPlannedDate(saved?.lastCelebratedDate) ? saved.lastCelebratedDate : "";
      } catch (error) { return ""; }
    }

    function celebrateAchievement(today, wordId) {
      if (lastCelebratedDate === today || loadCelebrationDate() === today) return;
      lastCelebratedDate = today;
      try {
        localStorage.setItem(CELEBRATION_KEY, JSON.stringify({ lastCelebratedDate: today }));
      } catch (error) {
        console.warn("お祝い履歴を保存できませんでした。", error);
      }
      showCelebration(wordId, selectCelebration(today));
    }

    function randomChoice(items) { return items[Math.floor(Math.random() * items.length)]; }

    function getCelebrationCandidates(today) {
      const eligibleIds = new Set(getAchievementWords(today)
        .filter((word) => state.records[word.id]?.attempted === true)
        .map((word) => String(word.id)));
      return CELEBRATION_MESSAGES.filter((message) => eligibleIds.has(message.word_id));
    }

    function selectCelebration(today) {
      const candidates = getCelebrationCandidates(today);
      return candidates.length ? randomChoice(candidates) : GENERIC_CELEBRATION;
    }

    function showCelebration(wordId, celebration = GENERIC_CELEBRATION) {
    /* NOTIFICATION START */
      reportViewDate = getTodayText();
      refreshReportButton();
    /* NOTIFICATION END */
      const overlay = document.getElementById("celebrationOverlay");
      document.getElementById("celebrationTitle").textContent = celebration.title;
      document.getElementById("celebrationIcon").textContent = celebration.emoji;
      document.getElementById("celebrationPraise").textContent = celebration.praise;
      const confetti = document.getElementById("celebrationConfetti");
      confetti.innerHTML = "";
      for (let index = 0; index < 16; index += 1) {
        const piece = document.createElement("i");
        piece.style.setProperty("--x", `${index * 6 + 2}%`);
        piece.style.setProperty("--delay", `${index % 4 * .15}s`);
        piece.style.setProperty("--color", randomChoice(["#efc35c", "#2f6f73", "#dd7291"]));
        confetti.appendChild(piece);
      }
      celebrationReturnFocus = Array.from(elements.cards.querySelectorAll("article"))
        .find((card) => card.dataset.wordId === String(wordId))?.querySelector('[data-kind="attempted"]')
        || elements.studyDate;
      celebrationScrollY = window.scrollY;
      document.body.style.position = "fixed";
      document.body.style.top = `-${celebrationScrollY}px`;
      document.body.style.width = "100%";
      const app = document.querySelector(".app");
      app.inert = true;
      app.setAttribute("aria-hidden", "true");
      overlay.hidden = false;
      document.getElementById("celebrationDone").focus();
    }

    function closeCelebration() {
      document.getElementById("celebrationOverlay").hidden = true;
      const app = document.querySelector(".app");
      app.inert = false;
      app.removeAttribute("aria-hidden");
      document.body.style.position = "";
      document.body.style.top = "";
      document.body.style.width = "";
      window.scrollTo(0, celebrationScrollY);
      (celebrationReturnFocus?.isConnected ? celebrationReturnFocus : elements.studyDate).focus({ preventScroll: true });
    }

    function getImageSrc(word) {
      const filename = String(word.image_filename || "").trim();
      return filename ? `images/${encodeURIComponent(filename)}` : "";
    }

    function getTodayText() {
      const now = new Date();
      const localDate = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
      return localDate.toISOString().slice(0, 10);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
